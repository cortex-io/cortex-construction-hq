<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-labelledby="t d">
  <title id="t">Cortex Holdings roadmap</title>
  <desc id="d">Eight phases. Complete: phase 1 MCP Server Foundation (9 MCP servers, 113+ tools); phase 2 Organizational Hierarchy (divisions, 7 GM templates, 3 contractor agents); phase 3 n8n Enhancements (retry logic, webhook management, 108 tests). Not started: phase 4 Agent Intelligence Layer; phase 5 Resource Manager Integration; phase 6 Union/Non-Union Permit System; phase 7 Production Deployment; phase 8 Advanced Features.</desc>
  <style>
    .fill{transform-box:fill-box;transform-origin:left;animation:grow 1.2s ease-out both}
    @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <rect x="1" y="1" width="898" height="378" rx="16" fill="#0d1117" stroke="#30363d"/>
